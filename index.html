<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<title>Almacén UTE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--APP-BODY-START-->
<header class="topbar">
  <button class="icon-btn" id="btn-back" aria-label="Volver" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="title">Almacén UTE</h1>
  <span class="mode-badge" id="mode-badge"></span>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabbar" id="tabbar">
  <a href="#/" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></a>
  <a href="#/buscar" data-tab="buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span>Buscar</span></a>
  <a href="#/escanear" data-tab="escanear" class="scan-tab"><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg><span>Escanear</span></a>
  <a href="#/movimiento" data-tab="movimiento"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span>Mover</span></a>
  <a href="#/mas" data-tab="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span>Más</span></a>
</nav>

<div class="scanner" id="scanner" hidden>
  <video id="scan-video" playsinline muted></video>
  <div class="scan-frame"><i></i><i></i><i></i><i></i></div>
  <p class="scan-hint" id="scan-hint">Apunta al código QR de la etiqueta</p>
  <div class="scan-actions">
    <label class="btn ghost light">
      <input type="file" accept="image/*" capture="environment" id="scan-photo" hidden>
      Hacer foto
    </label>
    <button class="btn ghost light" id="scan-torch" hidden>Linterna</button>
    <button class="btn light" id="scan-close">Cerrar</button>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-msg">
  <div class="modal-box">
    <p id="modal-msg"></p>
    <div class="modal-btns"><button class="btn ghost" id="modal-no">Cancelar</button><button class="btn" id="modal-si">Aceptar</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>
<!--APP-BODY-END-->

<script src="js/vendor/jsQR.js"></script>
<script src="js/vendor/qrcode.js"></script>
<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/scanner.js"></script>
<script src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
